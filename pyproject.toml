[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qubitfold"
version = "0.1.0"
description = "A small verified quantum circuit peephole optimizer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
qubitfold = "qubitfold.cli:main"

[tool.setuptools.packages.find]
include = ["qubitfold*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
